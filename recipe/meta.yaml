{% set name = "kilo" %}
{% set version = "7.8.12" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/Kilo-Org/kilocode/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 96050bedea55c3be9d976546fc225254cf8c50c5393087ad044d1b39e087f4d7
    patches:
      # Backport of Kilo-Org/kilocode#15105 (KILO_SKIP_PATCHELF and
      # KILO_SKIP_RELEASE_UPLOAD, set by build.sh / bld.bat): release build
      # without the GitHub upload or the patchelf interpreter rewrite.
      # Remove once #15105 is merged and released.
      - 0001-backport-kilocode-15105-distro-opt-outs.patch
  # Notices for embedded components that ship none themselves (everything else
  # is collected by collect-licenses.ts):
  # - @ff-labs/fff (native search library): MIT, repo at its 0.9.4 publish commit.
  - url: https://raw.githubusercontent.com/dmtrKovalenko/fff/7d7910b6ba78ea8406671eaac8cdb5eb9850d9d1/LICENSE
    sha256: f8264de82db188834a5711d7e348dc08c33db14f79bb587ccb42616fd694ee81
    fn: fff-LICENSE
  # - @openauthjs/openauth (snapshot release, no licence in the package): MIT.
  - url: https://raw.githubusercontent.com/anomalyco/openauth/b76be0a86d1e244b064f5320511e6a020f35a78a/LICENSE
    sha256: 3f12d40000ff2f6b9220cbdb7e5a6e24d48c4c0342097497793d38518f31264b
    fn: openauth-LICENSE
  # - Fonts in the console assets (Inter, JetBrains Mono, Roboto Mono): OFL-1.1.
  - url: https://raw.githubusercontent.com/rsms/inter/v4.1/LICENSE.txt
    sha256: 262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a
    fn: font-Inter-OFL.txt
  - url: https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304/OFL.txt
    sha256: 30f0c136e3c88e422d0791acd97238870f9054a9729bc34cf2ff0d4ed8cac4ad
    fn: font-JetBrainsMono-OFL.txt
  - url: https://raw.githubusercontent.com/googlefonts/RobotoMono/895ec691990d041dd727c7b5afa3ce56525d98e6/OFL.txt
    sha256: 50ab8dd54680d3473f649c9db86fece88434d097c7834475c1c72d2f8c429215
    fn: font-RobotoMono-OFL.txt

build:
  number: 1
  # bun (the compiler and runtime kilo is built into) is not built for osx-64.
  skip: true  # [osx and x86_64]
  # The kilo executable is conda's bun with the JS bundle embedded in it;
  # rpath rewriting or prefix replacement would corrupt the embedded bundle.
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  build:
    # `bun build --compile` copies the running bun into the kilo executable, so
    # this is also kilo's JS runtime. Upstream requires bun ^1.4.2
    # (package.json packageManager, enforced by packages/script).
    - bun >=1.4.2,<2
    - git
    # The executable is bun's, so it links libc like bun does: resolves those
    # DSOs for the overlinking check. bun's run_exports add its OS floor
    # (__glibc / __osx >=13.0) to run.
    - {{ stdlib('c') }}
  run:
    # kilo uses `rg` from PATH on unix; on Windows it ignores PATH (MSYS rg.exe
    # can be incompatible) and manages its own copy.
    - ripgrep  # [unix]
    # Linux sandbox: kilo looks for bwrap next to its executable (build.sh
    # links conda's bubblewrap there) instead of the bundled musl build, which
    # needs Zig.
    - bubblewrap  # [linux]

test:
  commands:
    - kilo --version  # [unix]
    - kilo --help  # [unix]
    - kilo --version 2>&1 | grep -Fx "{{ version }}"  # [unix]
    # kilo is a .bat wrapper on Windows: without `call` the test script ends
    # after the first command.
    - call kilo --version  # [win]
    - call kilo --help  # [win]
    - call kilo --version 2>&1 | findstr /L /C:"{{ version }}"  # [win]
    # build.sh runs upstream's build-time smoke tests (embedded models snapshot,
    # sandbox mutation worker) against the native binary.
    # -x follows the link, so it fails if conda's bwrap does not resolve.
    - test -x "${PREFIX}/libexec/kilo/bwrap"  # [linux]
    - test -f "${PREFIX}/libexec/kilo/tree-sitter/tree-sitter.wasm"  # [unix]
    - if not exist "%LIBRARY_PREFIX%\libexec\kilo\tree-sitter\tree-sitter.wasm" exit 1  # [win]

about:
  home: https://kilo.ai
  # The shipped closure: kilo (MIT) + the embedded bun runtime (bun-feedstock's
  # expression) + the compiled-in npm closure from upstream's SBOM graph
  # (collect-licenses.ts fails on a licence not listed here) + OFL-1.1 fonts.
  license: >-
    MIT AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND Apache-2.0 AND
    Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND ISC AND
    Zlib AND IJG AND Unicode-3.0 AND BlueOak-1.0.0 AND Unlicense AND 0BSD AND
    CC0-1.0 AND CC-BY-3.0 AND CC-BY-4.0 AND OFL-1.1 AND
    (BSD-3-Clause OR GPL-2.0-only) AND (AFL-2.1 OR BSD-3-Clause) AND
    (MPL-2.0 OR Apache-2.0) AND (MIT OR GPL-3.0-or-later) AND (MIT OR CC0-1.0)
  license_family: OTHER
  license_file:
    - LICENSE
    - fff-LICENSE
    - openauth-LICENSE
    - font-Inter-OFL.txt
    - font-JetBrainsMono-OFL.txt
    - font-RobotoMono-OFL.txt
    # Collected by collect-licenses.ts (run from build.sh / bld.bat): bun/ (the
    # conda bun build's own notices: WebKit/JSC LGPL, ICU, BoringSSL, tinycc,
    # ...) and npm/ (every compiled-in npm package's notices + MANIFEST.tsv).
    - third-party-licenses/
    # Kilo ships Anthropic's sandbox-runtime seccomp helper on linux.
    - sandbox-runtime-LICENSE  # [linux]
  summary: Open source AI coding agent for the terminal, VS Code, and JetBrains.
  description: |
    Kilo is an open source coding agent that runs in the terminal (CLI), VS Code,
    and JetBrains. This package provides the `kilo` CLI, built from source with
    bun.
  doc_url: https://kilo.ai/docs
  dev_url: https://github.com/Kilo-Org/kilocode

extra:
  recipe-maintainers:
    - JamesRobertsonGames
